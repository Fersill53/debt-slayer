<div class="app">
  <mat-toolbar class="toolbar" color="primary">
    <a class="brand" routerLink="/dashboard">Debt Slayer</a>

    <span class="spacer"></span>

    <button mat-icon-button [matMenuTriggerFor]="navMenu" aria-label="Open menu">
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #navMenu="matMenu">
      <a mat-menu-item routerLink="/dashboard" routerLinkActive="activeItem" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a mat-menu-item routerLink="/planner" routerLinkActive="activeItem" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>insights</mat-icon>
        <span>Payoff Planner</span>
      </a>

      <a mat-menu-item routerLink="/planner/compare" routerLinkActive="activeItem" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>compare_arrows</mat-icon>
        <span>Compare Strategies</span>
      </a>

      <a mat-menu-item routerLink="/debts" routerLinkActive="activeItem" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>credit_card</mat-icon>
        <span>Debts</span>
      </a>

      <a mat-menu-item routerLink="/debts/add" routerLinkActive="activeItem">
        <mat-icon>add</mat-icon>
        <span>Add Debt</span>
      </a>

      <a mat-menu-item routerLink="/goals" routerLinkActive="activeItem" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>flag</mat-icon>
        <span>Goals</span>
      </a>

      <a mat-menu-item routerLink="/goals/add" routerLinkActive="activeItem">
        <mat-icon>add_circle</mat-icon>
        <span>Add Goal</span>
      </a>

       <a mat-menu-item routerLink="/budget" routerLinkActive="activeItem">
        <mat-icon>account_balance_wallet</mat-icon>
        <span>Budget</span>
      </a>
    </mat-menu>
  </mat-toolbar>

  <main class="content">
    <router-outlet />
  </main>
</div>
