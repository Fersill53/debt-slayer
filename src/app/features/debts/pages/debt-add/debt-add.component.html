<section class="page">
  <header class="header">
    <div>
      <div class="eyebrow">Debts · New</div>
      <h1>Add <span class="accent">Debt</span></h1>
      <p class="sub">Enter the basics.</p>
    </div>

    <a mat-stroked-button routerLink="/debts">Back</a>
  </header>

  <mat-card>
    <mat-card-content>
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="grid">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Debt name</mat-label>
            <input matInput formControlName="name" placeholder="e.g., Chase Freedom" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Current balance</mat-label>
            <input matInput type="number" formControlName="balance" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>APR %</mat-label>
            <input matInput type="number" formControlName="apr" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Minimum payment</mat-label>
            <input matInput type="number" formControlName="minPayment" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Next due date (optional)</mat-label>
            <input matInput [matDatepicker]="duePicker" formControlName="dueDate" (click)="duePicker.open()" />
            <mat-datepicker-toggle matIconSuffix [for]="duePicker"></mat-datepicker-toggle>
            <mat-datepicker #duePicker></mat-datepicker>
            <mat-hint>Repeats monthly on this day</mat-hint>
          </mat-form-field>
        </div>

        <div class="actions">
          <button mat-button type="button" (click)="cancel()" [disabled]="saving()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="saving() || form.invalid">
            <span *ngIf="!saving()">Save</span>
            <span *ngIf="saving()">Saving…</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
