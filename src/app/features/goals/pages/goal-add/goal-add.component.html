<section class="page">
  <header class="header">
    <div>
      <h1>Add Goal</h1>
      <p class="sub">Trips, bills, repairs — plan ahead.</p>
    </div>

    <a mat-stroked-button routerLink="/goals">Back</a>
  </header>

  <mat-card>
    <mat-card-content>
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="grid">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Goal name</mat-label>
            <input matInput formControlName="name" placeholder="e.g., Hawaii Trip" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Category</mat-label>
            <mat-select formControlName="category">
              <mat-option value="trip">Trip</mat-option>
              <mat-option value="bill">Bill</mat-option>
              <mat-option value="repair">Repair</mat-option>
              <mat-option value="gift">Gift</mat-option>
              <mat-option value="other">Other</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Target date</mat-label>
            <input matInput type="date" formControlName="targetDate" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Target amount</mat-label>
            <input matInput type="number" formControlName="targetAmount" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Saved so far</mat-label>
            <input matInput type="number" formControlName="savedSoFar" />
          </mat-form-field>
        </div>

        <div class="actions">
          <button mat-button type="button" (click)="cancel()" [disabled]="saving()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="saving() || form.invalid">
            <span *ngIf="!saving()">Save</span>
            <span *ngIf="saving()">Saving…</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
